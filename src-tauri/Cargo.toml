[package]
name = "attend-nfc-bridge"
version = "2.0.0"
description = "Bridges USB NFC readers to web browsers via WebSocket"
edition = "2021"
license = "MIT"
repository = "https://github.com/hackclub/attend-nfc"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
pcsc = "2"
chrono = { version = "0.4", features = ["serde", "clock"] }
tokio = { version = "1", features = ["net", "sync", "time", "macros", "rt-multi-thread"] }
tokio-tungstenite = "0.27"
futures-util = "0.3"

[profile.release]
strip = true
lto = true
